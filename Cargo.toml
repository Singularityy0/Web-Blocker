[package]
name = "webblocker"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }